name: Deploy Web Folder to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Kaynak kodunu indir
      - name: Checkout
        uses: actions/checkout@v4

      # 2. (Opsiyonel) Dosyaların doğru indiğini kontrol et
      - name: Verify Directory Structure
        run: |
          echo "Mevcut dizin:"
          ls -R
          if [ -d "./web" ]; then
            echo "WEB klasörü bulundu!"
          else
            echo "HATA: WEB klasörü bulunamadı!"
            exit 1
          fi

      # 3. Pages Kurulumu
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. Sadece 'web' klasörünü yükle
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # BURASI ÖNEMLİ: Sadece 'web' klasörünün içeriğini alır
          path: './web'

      # 5. Yayına al
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
