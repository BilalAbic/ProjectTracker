name: Deploy static content to Pages

on:
  push:
    branches: ["main"] # Burası senin ana dalının adı olmalı (master da olabilir)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. ADIM: Kodları sunucuya indir (Bu adım ÇOK ÖNEMLİ)
      - name: Checkout
        uses: actions/checkout@v4

      # 2. ADIM: (DEBUG) Dosya yapısını kontrol et
      # Bu adım hatanın nedenini Loglarda görmemizi sağlayacak
      - name: List files in current directory
        run: |
          echo "Ana dizindeki dosyalar:"
          ls -R

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Burayı kontrol et: Klasör adın 'Web' mi 'web' mi?
          # Eğer klasörün 'src' içindeyse './src/web' yazmalısın.
          path: './web' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
